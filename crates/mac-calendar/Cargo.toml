[package]
name = "backfill-mac-calendar"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
jiff.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSDate",
    "NSEnumerator",
    "NSError",
    "NSObject",
    "NSPredicate",
    "NSString",
] }
objc2-event-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "EKCalendar",
    "EKCalendarItem",
    "EKEvent",
    "EKEventStore",
    "EKObject",
    "EKParticipant",
    "EKSource",
    "EKTypes",
] }
