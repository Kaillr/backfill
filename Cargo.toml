[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
backfill-core = { path = "crates/core" }
backfill-http = { path = "crates/http" }
backfill-toggl = { path = "crates/toggl" }
backfill-jira = { path = "crates/jira" }
backfill-git = { path = "crates/git" }
backfill-mac-calendar = { path = "crates/mac-calendar" }
gpui = { package = "gpui-ce", version = "0.3.0" }
gpui_platform = { package = "gpui_ce_platform", version = "0.3.0" }
gpui_elements = { package = "gpui_ce_elements", version = "0.3.0" }
jiff = { version = "0.2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev.package."*"]
opt-level = 2

# Published gpui-ce 0.3.0 crates with small fixes, each marked "Patched for backfill":
# - gpui_ce_macos deadlocks when the app opens a window at launch (did_finish_launching).
# - gpui_ce_elements text fields didn't scroll to the caret while typing or pasting.
[patch.crates-io]
gpui_ce_macos = { path = "vendor/gpui_ce_macos" }
gpui_ce_elements = { path = "vendor/gpui_ce_elements" }
